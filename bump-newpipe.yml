name: Naikkan pin NewPipe

# Manual (Actions > Run workflow). Me-resolve versi baru lewat Gradle, menulis ulang pin lewat
# scripts/newpipe/bump_pin.py, lalu membuka PR untuk DITINJAU. Tidak pernah push ke main.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Tag NewPipeExtractor baru (contoh v0.26.6)
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: bump-newpipe
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
        with:
          gradle-version: 8.10.2
      - name: Resolve versi baru
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/spike-newpipe/run.sh "$VERSION" "$GITHUB_WORKSPACE/_spike_out"
      - name: Tulis ulang pin
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/newpipe/bump_pin.py "$VERSION" --resolved "$GITHUB_WORKSPACE/_spike_out/resolved.txt" | tee _spike_out/bump.log
          {
            echo '### Diff dependensi NewPipe'
            echo '~~~'
            grep -E '^( +[-+~!] |NewPipe)' _spike_out/bump.log || true
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Buka PR untuk ditinjau
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BR="bump/newpipe-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BR"
          git add engine/newpipe scripts/newpipe/pins.sha256 progres.md
          if git diff --cached --quiet; then echo "Tidak ada perubahan."; exit 0; fi
          git commit -m "chore(newpipe): naikkan pin ke $VERSION"
          git push --force-with-lease origin "$BR"
          gh pr create --base main --head "$BR" --title "chore(newpipe): naikkan pin ke $VERSION" \
            --body-file _spike_out/bump.log || echo "PR sudah ada atau tidak bisa dibuat; cabang $BR sudah di-push."
          # Push oleh GITHUB_TOKEN tidak memicu build.yml, jadi picu manual pada cabang ini.
          gh workflow run build.yml --ref "$BR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bump-newpipe
          path: _spike_out/
          if-no-files-found: ignore
