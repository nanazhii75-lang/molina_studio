name: Release check (R8)

# Manual: membangun APK rilis (R8 + shrink resource) dan memeriksa bukan debuggable.
# Tidak memengaruhi build.yml. Unggah hasil sebagai artefak terpisah.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Gerbang telemetri dan URL
        run: python3 scripts/telemetry_gate.py
      - name: Gerbang komponen bundel
        run: python3 scripts/bundle_gate.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: 8.10.2
      - name: Siapkan kunci tanda tangan tetap
        env:
          MOLINA_KEYSTORE_B64: ${{ secrets.MOLINA_KEYSTORE_B64 }}
          MOLINA_KEYSTORE_PASSWORD: ${{ secrets.MOLINA_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$MOLINA_KEYSTORE_B64" ] && [ -n "$MOLINA_KEYSTORE_PASSWORD" ]; then
            echo "$MOLINA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/molina.p12"
            echo "MOLINA_KEYSTORE_FILE=$RUNNER_TEMP/molina.p12" >> "$GITHUB_ENV"
            echo "MOLINA_KEYSTORE_PASSWORD=$MOLINA_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret kunci belum diisi; APK rilis tidak bertanda tangan."
          fi
      - name: Pustaka native mpv (terverifikasi SHA-256)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch_native.sh
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Pastikan bukan debuggable
        run: |
          A=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for f in app/build/outputs/apk/release/*.apk; do
            if "$A" dump badging "$f" | grep -q "application-debuggable"; then
              echo "::error::$f masih debuggable"; exit 1
            fi
            echo "OK bukan debuggable: $f"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: molina-studio-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/
