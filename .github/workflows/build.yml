name: Build Molina Studio

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Gerbang telemetri dan URL
        run: python3 scripts/telemetry_gate.py
      - name: Gerbang komponen bundel
        run: python3 scripts/bundle_gate.py
      - name: Uji alat bump pin (libmpv)
        run: python3 scripts/native/test_bump_native.py
      - name: Uji alat bump pin (NewPipe)
        run: python3 scripts/newpipe/test_bump_pin.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
        with:
          gradle-version: 8.10.2
      - name: Siapkan kunci tanda tangan tetap
        env:
          MOLINA_KEYSTORE_B64: ${{ secrets.MOLINA_KEYSTORE_B64 }}
          MOLINA_KEYSTORE_PASSWORD: ${{ secrets.MOLINA_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$MOLINA_KEYSTORE_B64" ] && [ -n "$MOLINA_KEYSTORE_PASSWORD" ]; then
            echo "$MOLINA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/molina.p12"
            echo "MOLINA_KEYSTORE_FILE=$RUNNER_TEMP/molina.p12" >> "$GITHUB_ENV"
            echo "MOLINA_KEYSTORE_PASSWORD=$MOLINA_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Kunci tetap dipakai."
          else
            echo "::warning::Secret kunci belum diisi; memakai keystore debug acak."
          fi
      - name: Pustaka native mpv (terverifikasi SHA-256)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch_native.sh
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Cetak sidik jari tanda tangan APK
        run: |
          A=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$A" verify --print-certs app/build/outputs/apk/debug/*.apk | grep -i "SHA-256" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: molina-studio-debug
          path: app/build/outputs/apk/debug/*.apk
