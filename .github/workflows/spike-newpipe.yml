name: Spike NewPipe (Molina Cinema 5d-0)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Tag NewPipeExtractor yang dipin
        required: true
        default: v0.26.5

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
        with:
          gradle-version: 8.10.2
      - name: Resolve dari JitPack
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/spike-newpipe/run.sh "$VERSION" "$GITHUB_WORKSPACE/_spike_out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: spike-newpipe
          path: _spike_out/
          if-no-files-found: ignore
